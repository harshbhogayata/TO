{{- if not .Values.externalSecrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talentorbit.fullname" . }}-secret
  namespace: {{ include "talentorbit.namespace" . }}
  labels:
    {{- include "talentorbit.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default .Values.config.databaseUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  CHANNELS_REDIS_URL: {{ .Values.config.channelsRedisUrl | quote }}
  CELERY_BROKER_URL: {{ .Values.config.celeryBrokerUrl | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  R2_ACCESS_KEY_ID: {{ .Values.secrets.r2AccessKeyId | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.secrets.r2SecretAccessKey | quote }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  POSTHOG_API_KEY: {{ .Values.secrets.posthogApiKey | default .Values.config.posthogApiKey | quote }}
  {{- if .Values.secrets.firebaseCredentials }}
  FIREBASE_CREDENTIALS: {{ .Values.secrets.firebaseCredentials | quote }}
  {{- end }}
  {{- if .Values.pgbouncer.enabled }}
  PGBOUNCER_AUTH_PASSWORD: {{ .Values.pgbouncer.auth.password | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "talentorbit.fullname" . }}-secret
  namespace: {{ include "talentorbit.namespace" . }}
  labels:
    {{- include "talentorbit.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "talentorbit.fullname" . }}-store
    kind: ClusterSecretStore
  target:
    name: {{ include "talentorbit.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: REDIS_URL
    - secretKey: CHANNELS_REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: CHANNELS_REDIS_URL
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: CELERY_BROKER_URL
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: R2_SECRET_ACCESS_KEY
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: RESEND_API_KEY
    - secretKey: POSTHOG_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName | default "talentorbit/production" }}
        property: POSTHOG_API_KEY
{{- end }}
