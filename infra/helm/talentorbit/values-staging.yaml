###############################################################################
# TalentOrbit Helm — Staging Overrides
#
# Usage:
#   helm upgrade talentorbit ./infra/helm/talentorbit \
#     -f infra/helm/talentorbit/values-staging.yaml \
#     --namespace talentorbit-staging --create-namespace
###############################################################################

global:
  environment: staging

namespace:
  name: talentorbit-staging

config:
  debug: "False"
  frontendUrl: "https://staging.talentorbit.com"
  corsAllowedOrigins: "https://staging.talentorbit.com"
  sentryTracesSampleRate: "0.5"

api:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilization: 75
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  pdb:
    enabled: false

worker:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilization: 80
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  pdb:
    enabled: false

beat:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

pgbouncer:
  enabled: true
  replicaCount: 1
  defaultPoolSize: 10
  maxClientConnections: 100
  pdb:
    enabled: false

ingress:
  hosts:
    - host: api.staging.talentorbit.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: talentorbit-staging-tls
      hosts:
        - api.staging.talentorbit.com

networkPolicy:
  enabled: true
