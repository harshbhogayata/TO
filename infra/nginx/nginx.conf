###############################################################################
# TalentOrbit — Nginx Configuration
#
# Role: Reverse proxy for the Django ASGI application.
# Handles:
#   - HTTP → upstream Daphne
#   - WebSocket upgrade for /ws/ paths
#   - Static file serving from WhiteNoise (passed through)
#   - Request buffering and timeouts
#   - Security headers (defense-in-depth with Django's own headers)
#   - Connection limiting and rate limiting
#   - Gzip compression
###############################################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;                  # Don't reveal Nginx version

    # ── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml;

    # ── Rate Limiting Zones ─────────────────────────────────────────────────
    # API: 20 requests/second per IP (burst up to 40)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # Auth: 5 requests/second per IP (stricter)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # WebSocket: 2 connections/second per IP
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=2r/s;

    # ── Connection Limiting ─────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Upstream (Daphne ASGI server) ───────────────────────────────────────
    upstream backend {
        server api:8000;
        keepalive 32;
    }

    # Include per-server configs
    include /etc/nginx/conf.d/*.conf;
}
